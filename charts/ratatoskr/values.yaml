replicaCount: 2
image:
  repository: ghcr.io/mindtooth/ratatoskr
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
fullnameOverride: ""
serviceAccount:
  create: true
  name: ""
service:
  type: ClusterIP
  port: 8080
config:
  debug: false
  refreshInterval: 6h
  refreshTimeout: 30m
  maxSnapshotAge: 24h
  parseConcurrency: 2
  openshiftGraphURL: ""
  openshiftTimeout: 30s
  platform: linux/amd64
  channels: []
  # Empty selects all built-in catalogs: redhat, certified, and community.
  catalogs: []
  # Optional exact source overrides and custom sources.
  sources: []
registryAuth:
  existingSecret: ""
  key: auth.json
signaturePolicy:
  # Generate an insecureAcceptAnything policy for the selected operator index versions.
  # Versions are rendered as exact vX.Y tags for the selected built-in catalogs.
  operatorVersions: []
  existingConfigMap: ""
  existingSecret: ""
  key: policy.json
refreshToken:
  existingSecret: ""
  key: token
persistence:
  # Registry cache only; supported with replicaCount=1 and pdb.enabled=false.
  enabled: false
  existingClaim: ""
  size: 10Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  keep: true
emptyDir:
  cacheSizeLimit: 10Gi
  tmpSizeLimit: 1Gi
resources:
  requests:
    cpu: 100m
    memory: 512Mi
    ephemeral-storage: 1Gi
  limits: {}
route:
  enabled: false
  host: ""
  annotations: {}
networkPolicy:
  enabled: false
  ingress: []
pdb:
  enabled: true
  maxUnavailable: 1
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
# Empty uses preferred pod anti-affinity across nodes for this release.
# A nonempty affinity replaces that default.
affinity: {}
