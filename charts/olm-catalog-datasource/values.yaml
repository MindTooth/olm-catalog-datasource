replicaCount: 1
image:
  repository: ghcr.io/mindtooth/olm-catalog-datasource
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  name: ""
service:
  type: ClusterIP
  port: 8080
config:
  debug: false
  refreshInterval: 6h
  refreshTimeout: 30m
  parseConcurrency: 2
  openshiftGraphURL: ""
  openshiftTimeout: 30s
  platform: linux/amd64
  channels: []
  # Empty selects all built-in catalogs: redhat, certified, and community.
  catalogs: []
  # Optional exact source overrides and custom sources.
  sources: []
registryAuth:
  existingSecret: ""
  key: auth.json
signaturePolicy:
  existingConfigMap: ""
  existingSecret: ""
  key: policy.json
refreshToken:
  existingSecret: ""
  key: token
persistence:
  enabled: false
  existingClaim: ""
  size: 10Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  keep: true
emptyDir:
  cacheSizeLimit: 10Gi
  tmpSizeLimit: 1Gi
resources:
  requests:
    cpu: 100m
    memory: 512Mi
    ephemeral-storage: 1Gi
  limits: {}
route:
  enabled: false
  host: ""
  annotations: {}
networkPolicy:
  enabled: false
  ingress: []
pdb:
  enabled: false
  maxUnavailable: 1
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
