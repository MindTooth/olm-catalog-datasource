apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "olm-catalog-datasource.fullname" . }}
  labels:
    {{- include "olm-catalog-datasource.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 3600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "olm-catalog-datasource.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "olm-catalog-datasource.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "olm-catalog-datasource.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: datasource
          image: {{ include "olm-catalog-datasource.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/olm-catalog-datasource/config.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: OLM_CACHE_DIR
              value: /var/cache/olm
            {{- with .Values.registryAuth.existingSecret }}
            - name: REGISTRY_AUTH_FILE
              value: /var/run/registry-auth/{{ $.Values.registryAuth.key }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - {name: config, mountPath: /etc/olm-catalog-datasource, readOnly: true}
            - {name: policy, mountPath: /etc/containers, readOnly: true}
            - {name: cache, mountPath: /var/cache/olm}
            - {name: tmp, mountPath: /tmp}
            {{- with .Values.registryAuth.existingSecret }}
            - {name: registry-auth, mountPath: /var/run/registry-auth, readOnly: true}
            {{- end }}
            {{- with .Values.refreshToken.existingSecret }}
            - {name: refresh-token, mountPath: /var/run/olm-refresh-token, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ include "olm-catalog-datasource.fullname" . }}}
        - name: policy
          {{- if .Values.signaturePolicy.existingConfigMap }}
          configMap: {name: {{ .Values.signaturePolicy.existingConfigMap }}}
          {{- else }}
          secret: {secretName: {{ .Values.signaturePolicy.existingSecret }}}
          {{- end }}
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.emptyDir.tmpSizeLimit }}}
        - name: cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ default (include "olm-catalog-datasource.fullname" .) .Values.persistence.existingClaim }}}
          {{- else }}
          emptyDir: {sizeLimit: {{ .Values.emptyDir.cacheSizeLimit }}}
          {{- end }}
        {{- with .Values.registryAuth.existingSecret }}
        - name: registry-auth
          secret: {secretName: {{ . }}, defaultMode: 288}
        {{- end }}
        {{- with .Values.refreshToken.existingSecret }}
        - name: refresh-token
          secret: {secretName: {{ . }}, defaultMode: 288}
        {{- end }}
