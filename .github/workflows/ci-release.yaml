name: CI and release

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module dependencies
        run: |
          go mod download
          go mod verify

      - name: Vet production build configuration
        run: go vet -tags=containers_image_openpgp ./...

      - name: Test production build configuration
        run: go test -race -tags=containers_image_openpgp -coverprofile=coverage.out ./...

      - name: Build production binary
        run: CGO_ENABLED=0 go build -tags=containers_image_openpgp -trimpath -o /tmp/olm-catalog-datasource ./cmd/olm-catalog-datasource

  helm:
    name: Helm lint and API validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Lint the chart with required deployment values
        run: |
          helm lint --strict charts/olm-catalog-datasource --values .github/fixtures/helm/valid-values.yaml
          helm lint --strict charts/olm-catalog-datasource --values .github/fixtures/helm/explicit-source-values.yaml

      - name: Enforce chart version bumps for chart changes
        if: github.event_name == 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --target-branch "$TARGET_BRANCH"

      - name: Render Kubernetes variants
        run: |
          helm template olm-catalog-datasource charts/olm-catalog-datasource \
            --values .github/fixtures/helm/valid-values.yaml \
            > /tmp/chart-standard.yaml
          helm template olm-catalog-datasource charts/olm-catalog-datasource \
            --values .github/fixtures/helm/valid-values.yaml \
            --set persistence.enabled=true \
            --set pdb.enabled=true \
            --set replicaCount=2 \
            > /tmp/chart-persistence.yaml
          helm template olm-catalog-datasource charts/olm-catalog-datasource \
            --values .github/fixtures/helm/explicit-source-values.yaml \
            > /tmp/chart-explicit-source.yaml

      - name: Ensure PodDisruptionBudget requires high availability
        run: |
          if helm template olm-catalog-datasource charts/olm-catalog-datasource \
            --values .github/fixtures/helm/valid-values.yaml \
            --set pdb.enabled=true >/dev/null 2>&1; then
            echo 'pdb.enabled must require replicaCount >= 2' >&2
            exit 1
          fi

      - name: Render OpenShift route variant
        run: |
          helm template olm-catalog-datasource charts/olm-catalog-datasource \
            --values .github/fixtures/helm/valid-values.yaml \
            --values charts/olm-catalog-datasource/values-openshift.yaml \
            --api-versions route.openshift.io/v1/Route \
            > /tmp/chart-openshift.yaml

      - name: Ensure Route fails without the OpenShift API
        run: |
          if helm template olm-catalog-datasource charts/olm-catalog-datasource \
            --values .github/fixtures/helm/valid-values.yaml \
            --set route.enabled=true >/dev/null 2>&1; then
            echo 'route.enabled must require the OpenShift Route API' >&2
            exit 1
          fi

      - name: Create Kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: Validate rendered resources against the Kubernetes API
        run: |
          kubectl apply --server-side --dry-run=server --validate=strict -f /tmp/chart-standard.yaml
          kubectl apply --server-side --dry-run=server --validate=strict -f /tmp/chart-persistence.yaml
          kubectl apply --server-side --dry-run=server --validate=strict -f /tmp/chart-explicit-source.yaml

  container-verify:
    name: Container build
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      file: Containerfile
      output: image
      push: false
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create application release
    needs:
      - go
      - helm
      - container-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Create release and determine published version
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run release
          git fetch --force --tags origin
          tag="$(git tag --points-at HEAD --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -n "$tag" ]]; then
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

  container-publish:
    name: Publish application image
    needs:
      - release
    if: needs.release.outputs.version != ''
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      file: Containerfile
      output: image
      push: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
        type=semver,pattern={{major}},value=${{ needs.release.outputs.version }},enable=${{ !startsWith(needs.release.outputs.version, '0.') }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  chart-publish:
    name: Publish Helm chart
    needs:
      - release
      - container-publish
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.release.result == 'success' &&
      (needs.container-publish.result == 'success' || needs.container-publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Publish changed charts to GitHub Pages
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          mark_as_latest: false
          skip_existing: true
        env:
          CR_RELEASE_NAME_TEMPLATE: chart-{{ .Name }}-{{ .Version }}
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download released charts for OCI reconciliation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          mkdir -p .cr-release-packages
          for chart in charts/*/Chart.yaml; do
            [[ -f "$chart" ]] || continue
            chart_dir="$(dirname "$chart")"
            chart_name="$(helm show chart "$chart_dir" | awk -F ': ' '/^name:/ { print $2; exit }')"
            chart_version="$(helm show chart "$chart_dir" | awk -F ': ' '/^version:/ { print $2; exit }')"
            if [[ -z "$chart_name" || -z "$chart_version" ]]; then
              echo "could not determine chart name and version from $chart_dir" >&2
              exit 1
            fi
            gh release download "chart-${chart_name}-${chart_version}" \
              --pattern "${chart_name}-${chart_version}.tgz" \
              --dir .cr-release-packages \
              --clobber

            package=".cr-release-packages/${chart_name}-${chart_version}.tgz"
            if [[ ! -f "$package" ]]; then
              echo "release asset $package was not downloaded" >&2
              exit 1
            fi
            released_chart_name="$(helm show chart "$package" | awk -F ': ' '/^name:/ { print $2; exit }')"
            released_chart_version="$(helm show chart "$package" | awk -F ': ' '/^version:/ { print $2; exit }')"
            if [[ "$released_chart_name" != "$chart_name" || "$released_chart_version" != "$chart_version" ]]; then
              echo "release asset $package does not match ${chart_name}:${chart_version}" >&2
              exit 1
            fi
          done

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Reconcile released charts with OCI
        run: |
          shopt -s nullglob
          packages=(.cr-release-packages/*.tgz)
          if (( ${#packages[@]} == 0 )); then
            echo 'no released chart packages are available for OCI reconciliation' >&2
            exit 1
          fi

          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          for package in "${packages[@]}"; do
            chart_name="$(helm show chart "$package" | awk -F ': ' '/^name:/ { print $2; exit }')"
            chart_version="$(helm show chart "$package" | awk -F ': ' '/^version:/ { print $2; exit }')"
            if [[ -z "$chart_name" || -z "$chart_version" ]]; then
              echo "could not determine chart name and version from $package" >&2
              exit 1
            fi

            pull_dir="$(mktemp -d)"
            pull_output="$(mktemp)"
            trap 'rm -rf "$pull_dir"; rm -f "$pull_output"' EXIT
            if helm pull "oci://${registry}/${chart_name}" \
              --version "$chart_version" \
              --destination "$pull_dir" >"$pull_output" 2>&1; then
              existing_packages=("$pull_dir"/*.tgz)
              if (( ${#existing_packages[@]} != 1 )) || ! cmp -s "$package" "${existing_packages[0]}"; then
                echo "OCI chart ${chart_name}:${chart_version} already exists with different content" >&2
                exit 1
              fi
              echo "OCI chart ${chart_name}:${chart_version} already exists with identical content"
            elif grep -Eqi 'manifest unknown|not found|404' "$pull_output"; then
              helm push "$package" "oci://${registry}"
            else
              cat "$pull_output" >&2
              exit 1
            fi
            rm -rf "$pull_dir"
            rm -f "$pull_output"
            trap - EXIT
          done
