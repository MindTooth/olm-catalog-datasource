name: CI and release

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module dependencies
        run: |
          go mod download
          go mod verify

      - name: Vet production build configuration
        run: go vet -tags=containers_image_openpgp ./...

      - name: Test production build configuration
        run: go test -race -tags=containers_image_openpgp -coverprofile=coverage.out ./...

      - name: Build production binary
        run: CGO_ENABLED=0 go build -tags=containers_image_openpgp -trimpath -o /tmp/olm-catalog-datasource ./cmd/olm-catalog-datasource

  helm:
    name: Helm lint and API validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Lint the chart with required deployment values
        run: helm lint --strict charts/olm-catalog-datasource --values .github/fixtures/helm/valid-values.yaml

      - name: Enforce chart version bumps for chart changes
        if: github.event_name == 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --target-branch "$TARGET_BRANCH"

      - name: Render Kubernetes variants
        run: |
          helm template olm-catalog-datasource charts/olm-catalog-datasource \
            --values .github/fixtures/helm/valid-values.yaml \
            > /tmp/chart-standard.yaml
          helm template olm-catalog-datasource charts/olm-catalog-datasource \
            --values .github/fixtures/helm/valid-values.yaml \
            --set persistence.enabled=true \
            --set pdb.enabled=true \
            --set replicaCount=2 \
            > /tmp/chart-persistence.yaml

      - name: Ensure PodDisruptionBudget requires high availability
        run: |
          if helm template olm-catalog-datasource charts/olm-catalog-datasource \
            --values .github/fixtures/helm/valid-values.yaml \
            --set pdb.enabled=true >/dev/null 2>&1; then
            echo 'pdb.enabled must require replicaCount >= 2' >&2
            exit 1
          fi

      - name: Render OpenShift route variant
        run: |
          helm template olm-catalog-datasource charts/olm-catalog-datasource \
            --values .github/fixtures/helm/valid-values.yaml \
            --values charts/olm-catalog-datasource/values-openshift.yaml \
            --api-versions route.openshift.io/v1/Route \
            > /tmp/chart-openshift.yaml

      - name: Ensure Route fails without the OpenShift API
        run: |
          if helm template olm-catalog-datasource charts/olm-catalog-datasource \
            --values .github/fixtures/helm/valid-values.yaml \
            --set route.enabled=true >/dev/null 2>&1; then
            echo 'route.enabled must require the OpenShift Route API' >&2
            exit 1
          fi

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Validate rendered resources against the Kubernetes API
        run: |
          kubectl apply --server-side --dry-run=server --validate=strict -f /tmp/chart-standard.yaml
          kubectl apply --server-side --dry-run=server --validate=strict -f /tmp/chart-persistence.yaml

  container-verify:
    name: Container build
    uses: docker/github-builder/.github/workflows/build.yml@a492c6d04fd3315f67230809b44d60cc0acd50b3 # v1.16.0
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      file: Containerfile
      output: image
      push: false
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create application release
    needs:
      - go
      - helm
      - container-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Create release and determine published version
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run release
          git fetch --force --tags origin
          tag="$(git tag --points-at HEAD --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -n "$tag" ]]; then
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

  container-publish:
    name: Publish application image
    needs:
      - release
    if: needs.release.outputs.version != ''
    uses: docker/github-builder/.github/workflows/build.yml@a492c6d04fd3315f67230809b44d60cc0acd50b3 # v1.16.0
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      file: Containerfile
      output: image
      push: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
        type=semver,pattern={{major}},value=${{ needs.release.outputs.version }},enable=${{ !startsWith(needs.release.outputs.version, '0.') }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  chart-publish:
    name: Publish Helm chart
    needs:
      - release
      - container-publish
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.release.result == 'success' &&
      (needs.container-publish.result == 'success' || needs.container-publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Publish changed charts
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          mark_as_latest: false
          skip_existing: true
        env:
          CR_RELEASE_NAME_TEMPLATE: chart-{{ .Name }}-{{ .Version }}
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
